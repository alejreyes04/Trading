  RLUSD, BFUSD, XUSD, USDS, FRAX, LUSD, GUSD, BUSD, USDD, SUSD, UST, USTC, AEUR, EUR, GBP,
  TRY, BRL, AUD, RUB, UAH, NGN, ZAR, JPY, IDRT, BIDR, BVND, U, USDQ, USDG, USD0, USDF, FXUSD]
